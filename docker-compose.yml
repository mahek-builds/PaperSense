services:
    backend:
        build:
            context: "./python api"
            dockerfile: Dockerfile
        container_name: papersense_backend
        ports:
            - "8002:8000"
        environment:
            "GROQ_API_KEY": ${GROQ_API_KEY}
        env_file:
            - "./python api/.env"
        volumes:
            - faiss_data:/app/faiss_index
            - temp_data:/app/temp
        restart: unless-stopped

    frontend:
        build:
            context: ./my-app
            dockerfile: Dockerfile
        container_name: papersense_frontend
        ports:
            - "3002:80"
        depends_on:
            - backend
        restart: unless-stopped

volumes:
    faiss_data:
    temp_data:
